<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OCOM RCA Analyzer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:400px;background:#0d1117;color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;padding:16px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo-icon{font-size:22px}
.logo-title{font-size:14px;font-weight:700;color:#58a6ff}
.logo-sub{font-size:11px;color:#8b949e}

/* Token status bar */
.token-bar{display:flex;align-items:center;gap:8px;background:#161b22;border:1px solid #30363d;
  border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ok{background:#3fb950}
.dot-none{background:#f85149}
.token-bar a{color:#58a6ff;text-decoration:none;margin-left:auto;font-size:11px}
.token-bar a:hover{text-decoration:underline}

label{display:block;color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
#url-input{width:100%;background:#161b22;border:1px solid #30363d;border-radius:6px;
  padding:9px 12px;color:#e6edf3;font-size:12px;font-family:monospace;outline:none;margin-bottom:10px}
#url-input:focus{border-color:#58a6ff}
#analyze-btn{width:100%;background:#58a6ff;color:#000;border:none;border-radius:6px;
  padding:10px;font-size:14px;font-weight:700;cursor:pointer}
#analyze-btn:hover{background:#79b8ff}
#analyze-btn:disabled{opacity:.4;cursor:not-allowed}

.err{color:#f85149;font-size:12px;margin-top:6px}
.tip{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 10px;margin-top:10px;font-size:11px;color:#8b949e}
.tip strong{color:#58a6ff}
.reload-row{display:flex;align-items:center;gap:10px;margin-top:10px}
#reload-btn{background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:6px;
  padding:7px 14px;font-size:12px;cursor:pointer;white-space:nowrap}
#reload-btn:hover{border-color:#58a6ff;color:#58a6ff}
.reload-hint{font-size:11px;color:#484f58}
</style>
</head>
<body>
<div class="logo">
  <span class="logo-icon">⚙</span>
  <div>
    <div class="logo-title">OCOM RCA Analyzer</div>
    <div class="logo-sub">GitHub Actions Failure Analysis</div>
  </div>
</div>

<!-- Token status (1 line, no input field) -->
<div class="token-bar" id="token-bar">
  <span class="dot" id="token-dot"></span>
  <span id="token-label">Checking token…</span>
  <a href="#" id="settings-link">⚙ Settings</a>
</div>

<label for="url-input">GitHub Actions Run URL</label>
<input id="url-input" type="text" placeholder="https://github.com/Albertsons/ocom-api-automation/actions/runs/…" />

<div id="err" class="err" style="display:none"></div>

<button id="analyze-btn">Analyze Run →</button>

<div class="tip">
  Or just open any Actions run page — a blue <strong>⚙ Analyze RCA</strong> button appears automatically.
</div>

<div class="reload-row">
  <button id="reload-btn" title="Hard reload after updating extension files">🔄 Reload Extension</button>
  <span class="reload-hint">Apply code changes</span>
</div>

<script src="popup.js"></script>
</body>
</html>
